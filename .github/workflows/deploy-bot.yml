name: deploy-bot

# Deploys Pipdon BOT (bot/) to Cloudflare Workers and points Telegram at it.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (plus the Telegram ones).
on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/deploy-bot.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bot
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_TOKEN TELEGRAM_CHAT_ID; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Skipping deploy, missing secrets:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Test the bot
        if: steps.check.outputs.skip != 'true'
        run: node --test bot/worker.test.mjs bot/desk.test.mjs

      - name: Trade Desk storage (Cloudflare KV, created once)
        if: steps.check.outputs.skip != 'true'
        working-directory: bot
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | jq -r '.result[]? | select(.title=="pipdon-desk") | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              -d '{"title":"pipdon-desk"}' "$API" | jq -r '.result.id // empty')
          fi
          if [ -n "$ID" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "DESK"\nid = "%s"\n' "$ID" >> wrangler.toml
            echo "KV ready"
          else
            echo "::warning::Could not create the KV namespace (token needs Workers KV Storage: Edit). Trade Desk commands stay off."
          fi

      - name: Deploy to Cloudflare
        if: steps.check.outputs.skip != 'true'
        working-directory: bot
        run: npx --yes wrangler@4 deploy

      - name: Set the bot's secrets
        if: steps.check.outputs.skip != 'true'
        working-directory: bot
        run: |
          WEBHOOK_SECRET=$(printf '%s' "$TELEGRAM_TOKEN" | sha256sum | cut -c1-48)
          printf '%s' "$TELEGRAM_TOKEN"   | npx --yes wrangler@4 secret put TELEGRAM_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" | npx --yes wrangler@4 secret put TELEGRAM_CHAT_ID
          printf '%s' "$WEBHOOK_SECRET"   | npx --yes wrangler@4 secret put WEBHOOK_SECRET
          TV_KEY=$(printf 'tv:%s' "$TELEGRAM_TOKEN" | sha256sum | cut -c1-32)
          printf '%s' "$TV_KEY"           | npx --yes wrangler@4 secret put TV_KEY
          if [ -n "$ACCOUNT_BALANCE" ]; then
            printf '%s' "$ACCOUNT_BALANCE" | npx --yes wrangler@4 secret put ACCOUNT_BALANCE
          fi

      - name: Point Telegram at the bot
        if: steps.check.outputs.skip != 'true'
        run: |
          SUB=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            echo "::error::No workers.dev subdomain yet. Open Cloudflare → Workers & Pages once to create it, then re-run."
            exit 1
          fi
          URL="https://pipdon-bot.$SUB.workers.dev"
          WEBHOOK_SECRET=$(printf '%s' "$TELEGRAM_TOKEN" | sha256sum | cut -c1-48)
          RESP=$(curl -sS "https://api.telegram.org/bot$TELEGRAM_TOKEN/setWebhook" \
            --data-urlencode "url=$URL" --data-urlencode "secret_token=$WEBHOOK_SECRET" \
            --data-urlencode 'allowed_updates=["message","edited_message"]' --data-urlencode "drop_pending_updates=true")
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::setWebhook failed: $RESP"; exit 1; }
          curl -sS "https://api.telegram.org/bot$TELEGRAM_TOKEN/setMyCommands" -H 'content-type: application/json' -d '{"commands":[
            {"command":"status","description":"Price, ranges, ATR, ADR used, effort, MT5 price — e.g. /status 6E"},
            {"command":"all","description":"Every instrument on one screen"},
            {"command":"levels","description":"Day, week and session highs/lows — e.g. /levels gold"},
            {"command":"effort","description":"Last 6 bars: effort, spread, close — e.g. /effort 6J"},
            {"command":"strength","description":"Currency strength ranking (1h, 1d, 1w)"},
            {"command":"convert","description":"Futures level to MT5 price — /convert 6J 0.0067100"},
            {"command":"size","description":"Lots — /size 6E entry stop A|B|C balance"},
            {"command":"health","description":"Is the robot data fresh?"},
            {"command":"scan","description":"Every chart: major swing + live Wyckoff ranges"},
            {"command":"story","description":"Wyckoff Story of a chart — /story 6E 4h"},
            {"command":"brief","description":"This morning's brief"},
            {"command":"open","description":"Manage a trade — /open 6E long 1.0909 1.0889 B"},
            {"command":"trades","description":"Open trades, R now, stops"},
            {"command":"close","description":"Close a trade — /close 6E [price]"},
            {"command":"guard","description":"OK / REDUCE / BLOCKED — /guard B"},
            {"command":"pnl","description":"Today realised % — /pnl -0.4"},
            {"command":"dd","description":"Account vs start % — /dd 3"},
            {"command":"help","description":"Everything Pipdon BOT can do"}]}' > /dev/null
          curl -sS "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=Pipdon BOT · 💬 I can answer now. Send /help or just ask, e.g. \"how's gold\"." > /dev/null
          TV_KEY=$(printf 'tv:%s' "$TELEGRAM_TOKEN" | sha256sum | cut -c1-32)
          curl -sS "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=Pipdon BOT · 📐 TradingView alerts: paste this as the alert's Webhook URL (keep it private): $URL/tv/$TV_KEY" > /dev/null
          echo "Bot live at $URL"
