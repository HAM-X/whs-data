name: weekly-audit
# Heal fix 8 · Saturday morning: the robot grades every claim it published in the last 7 days (jobs/audit.py).
# Needs the full git history of data/decisions.json, so it checks out with fetch-depth 0. Commits nothing.
on:
  schedule:
    - cron: "47 4 * * 6"          # Sat 07:47 UTC+3
  workflow_dispatch:
    inputs:
      days:
        description: "days to audit"
        required: false
        default: "7"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m jobs.audit ${{ github.event.inputs.days || '7' }}
