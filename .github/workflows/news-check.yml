name: news-check
# Manual diagnostic: fetch the live calendar feed, parse it with whs/news.py and print what the robot would store,
# the blackout windows and the next pre-alerts. Changes nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch and parse the calendar
        run: |
          python - <<'PY'
          import json, pandas as pd
          from whs import news
          raw = news.fetch_week()
          print("raw items:", len(raw)); print("first raw item:", json.dumps(raw[0]) if raw else None)
          print("keys seen:", sorted({k for x in raw for k in x}))
          print("impacts:", sorted({x.get("impact") for x in raw}))
          print("countries:", sorted({x.get("country") for x in raw}))
          ev = news.normalise(raw)
          hi = news.high(ev)
          print("kept:", len(ev), "high:", len(hi), "with actual:", sum(1 for e in ev if e.get("actual")))
          now = pd.Timestamp.now(tz="UTC")
          for e in hi:
              print(" ", pd.Timestamp(e["t"]).tz_convert("Africa/Nairobi").strftime("%a %d %H:%M"), e["ccy"], e["title"],
                    "| fc", e["forecast"], "| prev", e["previous"], "| act", e["actual"], "| blocks", " ".join(news.keys_for(e["ccy"])))
          print(); print(news.report(ev, [], now))
          lines, _ = news.pre_alerts(ev, now, [])
          print(); print("pre-alerts now:", lines)
          # annotations (readable through the REST API): summary, then the high-impact list in chunks
          def note(title, text):
              print(f"::notice title={title}::" + text.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          note("feed", f"raw {len(raw)} · kept {len(ev)} · high {len(hi)} · with actual {sum(1 for e in ev if e.get('actual'))}\n"
                       f"keys {sorted({k for x in raw for k in x})}\nimpacts {sorted({str(x.get('impact')) for x in raw})}\n"
                       f"first {json.dumps(raw[0]) if raw else None}")
          rows = [f"{pd.Timestamp(e['t']).tz_convert('Africa/Nairobi').strftime('%a %d %H:%M')} {e['ccy']} {e['title']} | fc {e['forecast']} | prev {e['previous']} | act {e['actual']}" for e in hi]
          for i in range(0, len(rows), 15):
              note(f"high {i // 15 + 1}", "\n".join(rows[i:i + 15]))
          note("pre-alerts", "\n".join(lines) or "none in the next 75 min")
          PY
