name: mock-1m
# One-off (branch mock-1m only): builds a footprint for the WHS Flow design mock from Yahoo 1-minute 6E bars, the way TradingView
# builds its own (buy = an up minute, sell = a down minute; flat → vs the previous minute's close, else inherit). Outputs only the
# per-1h-bar aggregate as annotations. Nothing is committed.
on:
  push:
    branches: [mock-1m]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=1.7,<2"
      - run: |
          python - <<'PY'
          import json, math, zlib, base64
          import yfinance as yf, numpy as np, pandas as pd
          d = yf.Ticker("6E=F").history(period="7d", interval="1m", auto_adjust=False, prepost=True)
          d = d[d.Volume > 0].copy()
          d.index = d.index.tz_convert("UTC")
          o, c = d.Open.to_numpy(), d.Close.to_numpy()
          side = np.zeros(len(d), int); prev = 1
          for i in range(len(d)):
              s = 1 if c[i] > o[i] else -1 if c[i] < o[i] else (1 if i and c[i] > c[i-1] else -1 if i and c[i] < c[i-1] else prev)
              side[i] = s; prev = s
          d["side"] = side
          tick, rowt = 0.00005, 2
          row = tick * rowt
          out = []
          for t, g in d.groupby(d.index.floor("h")):
              H, L = g.High.max(), g.Low.min()
              lo = math.floor(L / row + 1e-9) * row
              n = int(round((H - lo) / row)) + 1
              buy, sell = np.zeros(n), np.zeros(n)
              for _, m in g.iterrows():
                  a = int(math.floor((m.Low - lo) / row + 1e-9)); b = int(math.floor((m.High - lo) / row + 1e-9))
                  a, b = max(0, a), min(n - 1, b)
                  share = m.Volume / (b - a + 1)
                  (buy if m.side > 0 else sell)[a:b + 1] += share
              out.append(dict(t=t.isoformat(), o=float(g.Open.iloc[0]), h=float(H), l=float(L), c=float(g.Close.iloc[-1]), v=float(g.Volume.sum()),
                              lo=round(lo, 6), row=row, b=[round(x) for x in buy], s=[round(x) for x in sell], m=len(g)))
          blob = base64.b64encode(zlib.compress(json.dumps(out, separators=(",", ":")).encode(), 9)).decode()
          print("bars", len(out), "chars", len(blob))
          open("blob.txt", "w").write(blob)
          PY
      - run: python -c "b=open('blob.txt').read(); [print(f'::notice title=fp{k}::'+b[k*4000:(k+1)*4000]) for k in range(0, 10) if b[k*4000:]]"
      - run: python -c "b=open('blob.txt').read(); [print(f'::notice title=fp{k}::'+b[k*4000:(k+1)*4000]) for k in range(10, 20) if b[k*4000:]]"
      - run: python -c "b=open('blob.txt').read(); [print(f'::notice title=fp{k}::'+b[k*4000:(k+1)*4000]) for k in range(20, 30) if b[k*4000:]]"
      - run: python -c "b=open('blob.txt').read(); [print(f'::notice title=fp{k}::'+b[k*4000:(k+1)*4000]) for k in range(30, 40) if b[k*4000:]]"
      - run: python -c "b=open('blob.txt').read(); [print(f'::notice title=fp{k}::'+b[k*4000:(k+1)*4000]) for k in range(40, 50) if b[k*4000:]]"
