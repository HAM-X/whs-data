name: mock-1m
# One-off (branch mock-1m only): 15m 6E bars + per-CME-session volume at price (1 tick rows, buy = up minute, sell = down minute,
# TradingView's method) from Yahoo 1-minute bars, for the WHS Flow mock. Output as annotations only. Nothing committed.
on:
  push:
    branches: [mock-1m]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=1.7,<2"
      - run: |
          python - <<'PY'
          import json, math, zlib, base64
          import yfinance as yf, numpy as np, pandas as pd
          d = yf.Ticker("6E=F").history(period="7d", interval="1m", auto_adjust=False, prepost=True)
          d = d[d.Volume > 0].copy(); d.index = d.index.tz_convert("UTC")
          o, c = d.Open.to_numpy(), d.Close.to_numpy(); side = np.zeros(len(d), int); prev = 1
          for i in range(len(d)):
              s = 1 if c[i] > o[i] else -1 if c[i] < o[i] else (1 if i and c[i] > c[i-1] else -1 if i and c[i] < c[i-1] else prev)
              side[i] = s; prev = s
          d["side"] = side
          q = d.resample("15min").agg({"Open": "first", "High": "max", "Low": "min", "Close": "last", "Volume": "sum"}).dropna()
          bars = [[t.isoformat(), r.Open, r.High, r.Low, r.Close, r.Volume] for t, r in q.iterrows()]
          ct = d.index.tz_convert("America/Chicago")
          sess = (ct + pd.Timedelta(hours=7)).date
          tick = 0.00005; prof = {}
          for (sd), g in d.groupby(sess):
              lo = math.floor(g.Low.min() / tick + 1e-9) * tick; n = int(round((g.High.max() - lo) / tick)) + 1
              B, S = np.zeros(n), np.zeros(n)
              for _, m in g.iterrows():
                  a = int(math.floor((m.Low - lo) / tick + 1e-9)); b = int(math.floor((m.High - lo) / tick + 1e-9))
                  a, b = max(0, a), min(n - 1, b); sh = m.Volume / (b - a + 1)
                  (B if m.side > 0 else S)[a:b + 1] += sh
              prof[str(sd)] = dict(lo=round(lo, 6), b=[round(x) for x in B], s=[round(x) for x in S], t0=g.index.min().isoformat())
          blob = base64.b64encode(zlib.compress(json.dumps(dict(bars=bars, prof=prof), separators=(",", ":")).encode(), 9)).decode()
          print("chars", len(blob)); open("blob.txt", "w").write(blob)
          PY
      - run: python -c "b=open('blob.txt').read(); [print(f'::notice title=fp{k}::'+b[k*4000:(k+1)*4000]) for k in range(0, 10) if b[k*4000:]]"
      - run: python -c "b=open('blob.txt').read(); [print(f'::notice title=fp{k}::'+b[k*4000:(k+1)*4000]) for k in range(10, 20) if b[k*4000:]]"
      - run: python -c "b=open('blob.txt').read(); [print(f'::notice title=fp{k}::'+b[k*4000:(k+1)*4000]) for k in range(20, 30) if b[k*4000:]]"
      - run: python -c "b=open('blob.txt').read(); [print(f'::notice title=fp{k}::'+b[k*4000:(k+1)*4000]) for k in range(30, 40) if b[k*4000:]]"
      - run: python -c "b=open('blob.txt').read(); [print(f'::notice title=fp{k}::'+b[k*4000:(k+1)*4000]) for k in range(40, 50) if b[k*4000:]]"
