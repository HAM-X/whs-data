name: probe
# Manual diagnostic: answer a question with jobs/ask.py WITHOUT sending it to Telegram; the answer comes back as
# annotations (readable through the API). Changes nothing.
on:
  workflow_dispatch:
    inputs:
      q:
        description: "question, e.g. '6e 5m vsa trend'"
        required: true
        default: "6e 5m vsa"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          Q: ${{ github.event.inputs.q }}
        run: |
          python - <<'PY'
          import os, re
          import jobs.ask as A
          out = []
          A.answer(os.environ["Q"], send_text=lambda t, html=False: out.append(t), send_photo=lambda p, c: out.append("[card]\n" + c))
          for i, block in enumerate(out):
              txt = re.sub(r"<[^>]+>", "", block).replace("&lt;", "<").replace("&gt;", ">").replace("&amp;", "&")
              print(f"::notice title=probe {i}::" + txt.replace("%", "%25").replace("\n", "%0A")[:3900])
          PY
