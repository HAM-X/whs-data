name: probe
# Manual diagnostic: what Yahoo returns for the futures on 15m and 5m (rows, first/last bar, volume present). Changes nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import yfinance as yf, time
          rows = []
          for t in ["6E=F", "6B=F", "6A=F", "6N=F", "6J=F", "6C=F", "6S=F", "GC=F"]:
              for iv, per in (("15m", "60d"), ("5m", "60d"), ("5m", "5d")):
                  t0 = time.time()
                  try:
                      d = yf.Ticker(t).history(period=per, interval=iv, prepost=True, auto_adjust=False, actions=False, timeout=30)
                      rows.append(f"{t} {iv} {per}: {len(d)} rows {d.index[0] if len(d) else ''} → {d.index[-1] if len(d) else ''} vol>0 {int((d.Volume > 0).mean() * 100) if len(d) else 0}% {time.time() - t0:.1f}s")
                  except Exception as e:
                      rows.append(f"{t} {iv} {per}: ERROR {type(e).__name__}: {e}")
          print("::notice title=yahoo intraday::" + "%0A".join(rows))
          PY
