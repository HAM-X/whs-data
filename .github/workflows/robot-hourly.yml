name: robot-hourly

# Pipdon BOT data robot. Does the work at hh:12 every hour (UTC+3 too), Sunday to Friday.
# GitHub's scheduler alone was unreliable (runs 3–7 h apart), so each run loops for ~5h40m and then
# starts the next run itself (scripts/robot_loop.sh). The cron below is only a backup starter.
on:
  schedule:
    - cron: "12 * * * 0-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Download Yahoo's full ~2 years of 1h history"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: robot-data
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Robot loop (hourly at hh:12 for ~5h40m)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRST_ARGS: ${{ github.event.inputs.backfill == 'true' && '--backfill' || '' }}
          LOOP_MINUTES: "340"
        run: |
          git config user.name "pipdon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/robot_loop.sh

      - name: Hand over to the next run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run robot-hourly.yml -R "${{ github.repository }}" --ref main

      - name: Tell Hamza if the job itself crashed
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TOKEN" ] && exit 0
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Pipdon BOT · ❌ robot-hourly crashed. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
