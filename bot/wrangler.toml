# Pipdon BOT on Cloudflare Workers (free plan). Deployed by .github/workflows/deploy-bot.yml.
name = "pipdon-bot"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

[vars]
SNAPSHOT_URL = "https://raw.githubusercontent.com/HAM-X/whs-data/main/data/snapshot.json"
XAU_CONTRACT = "100"   # oz per 1.00 lot of XAUUSD on your MT5 master account; change if different
